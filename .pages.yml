media:
  input: public/images
  output: /images

content:
  - name: products
    label: 产品
    type: collection
    path: src/content/products
    filename: '{title}.md'
    view:
      fields: [title, category, price, featured]
    fields:
      - name: title
        label: 产品名称
        type: string
        required: true
      - name: category
        label: 分类
        type: string
        required: true
      - name: price
        label: 价格
        type: number
      - name: description
        label: 简短描述
        type: string
      - name: images
        label: 产品图片
        type: image
        list: true
      - name: featured
        label: 推荐
        type: boolean
        default: false
      - name: order
        label: 排序
        type: number
        default: 0
      - name: body
        label: 详细描述
        type: rich-text

  - name: banners
    label: 首页轮播图
    type: collection
    path: src/content/banners
    filename: '{title}.md'
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: image
        label: 图片
        type: image
        required: true
      - name: link
        label: 跳转链接 (可选)
        type: string
      - name: order
        label: 排序
        type: number
        default: 0

  - name: links
    label: 自定义链接
    type: collection
    path: src/content/links
    filename: '{title}.md'
    fields:
      - name: title
        label: 名称
        type: string
        required: true
      - name: url
        label: 链接地址
        type: string
        required: true
      - name: icon
        label: 图标 (Emoji或字符)
        type: string
      - name: order
        label: 排序
        type: number
        default: 0

media:
  input: public/images
  output: /images

content:
  - name: products          # 必须保留英文！
    label: 产品             # 这里可以显示为中文
    type: collection
    path: src/content/products
    filename: '{title}.md'  # 这里的 title 对应下方字段的 name，不能写成 '{标题}.md'
    view:
      fields: [title, category, price, featured]
    fields:
      - name: title          # 系统内部叫 title，不要改成中文
        label: 产品名称       # 界面上显示为“产品名称”
        type: string
        required: true
      - name: category
        label: 分类
        type: string
        required: true
      - name: price
        label: 价格
        type: number
      - name: description
        label: 简短描述
        type: string
      - name: images
        label: 产品图片
        type: image
        list: true
      - name: featured
        label: 推荐
        type: boolean
        default: false
      - name: order
        label: 排序（数字越小越靠前）
        type: number
        default: 0
      - name: body
        label: 详细描述
        type: rich-text
